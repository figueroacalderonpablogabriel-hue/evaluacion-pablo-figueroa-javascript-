<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TecnoStock</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Tienda tecnológica</p>
        <h1>TecnoStock</h1>
      </div>
      <div class="cart-summary" aria-live="polite">
        <span class="summary-label">Carrito</span>
        <strong id="cartBadge">0 unidades</strong>
      </div>
    </header>

    <main class="app-shell">
      <section class="panel filters-panel" aria-labelledby="filters-title">
        <div class="section-head">
          <h2 id="filters-title">Búsqueda y filtros</h2>
        </div>

        <div class="filter-box">
          <div class="field">
            <label for="searchInput">Buscar producto</label>
            <input id="searchInput" type="search" placeholder="Nombre o descripción" />
          </div>

          <div class="field">
            <label for="categoryFilter">Categoría</label>
            <select id="categoryFilter">
              <option value="all">Todas</option>
            </select>
          </div>

          <div class="field">
            <label for="sortBy">Ordenar por</label>
            <select id="sortBy">
              <option value="none">Sin orden</option>
              <option value="price-asc">Precio: menor a mayor</option>
              <option value="price-desc">Precio: mayor a menor</option>
            </select>
          </div>

          <div class="field checkbox-field">
            <label for="availableOnly">Solo disponibles</label>
            <input id="availableOnly" type="checkbox" />
          </div>
        </div>

        <div class="filter-actions">
          <button id="clearFiltersBtn" type="button" class="secondary-btn">Limpiar filtros</button>
        </div>
      </section>

      <div id="statusMessage" class="status-message" aria-live="polite"></div>

      <div class="content-grid">
        <section class="panel catalog-panel" aria-labelledby="catalog-title">
          <div class="section-head">
            <h2 id="catalog-title">Catálogo</h2>
          </div>
          <product-list id="productList"></product-list>
        </section>

        <aside class="panel cart-panel" aria-labelledby="cart-title">
          <div class="section-head">
            <h2 id="cart-title">Carrito</h2>
          </div>
          <shopping-cart id="shoppingCart"></shopping-cart>
        </aside>
      </div>

      <section class="panel summary-panel" aria-labelledby="summary-title">
        <div class="section-head">
          <h2 id="summary-title">Resumen del pedido</h2>
        </div>

        <div class="summary-box">
          <div class="summary-row">
            <span>Subtotal</span>
            <strong id="subtotalValue">$0</strong>
          </div>
          <div class="summary-row">
            <span>Descuento</span>
            <strong id="discountValue">$0</strong>
          </div>
          <div class="summary-row total-row">
            <span>Total</span>
            <strong id="totalValue">$0</strong>
          </div>
        </div>

        <div class="order-box">
          <h3>Confirmación</h3>
          <p id="orderDetails">Aún no has realizado un pedido.</p>
        </div>

        <button id="confirmOrderBtn" type="button" class="confirm-btn">Confirmar pedido</button>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
