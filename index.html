<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TecnoStock</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- type="module" permite usar import/export en los archivos JS -->
  <script type="module" src="js/app.js"></script>
</head>
<body>

  <!-- CABECERA: nombre de la tienda y unidades del carrito -->
  <header class="cabecera">
    <h1>TecnoStock</h1>
    <p aria-live="polite">Carrito: <strong id="unidades">0</strong> unidades</p>
  </header>

  <main>
    <!-- Mensajes de las operaciones del carrito (éxito o error) -->
    <p id="mensajes" class="mensaje" role="status" aria-live="polite"></p>

    <!-- BÚSQUEDA, FILTROS Y ORDEN -->
    <section aria-labelledby="titulo-filtros">
      <h2 id="titulo-filtros">Buscar y filtrar</h2>
      <form id="filtros">
        <fieldset id="campos-filtros" disabled>
          <legend class="solo-lectores">Filtros del catálogo</legend>

          <div class="campo">
            <label for="buscar">Buscar por nombre o descripción</label>
            <input type="search" id="buscar" placeholder="Ej: teclado">
          </div>

          <div class="campo">
            <label for="categoria">Categoría</label>
            <select id="categoria">
              <option value="todas">Todas las categorías</option>
            </select>
          </div>

          <div class="campo">
            <label for="orden">Ordenar por precio</label>
            <select id="orden">
              <option value="ninguno">Sin ordenar</option>
              <option value="precio-asc">Menor a mayor</option>
              <option value="precio-desc">Mayor a menor</option>
            </select>
          </div>

          <div class="campo campo-check">
            <input type="checkbox" id="disponibles">
            <label for="disponibles">Mostrar solo productos disponibles</label>
          </div>

          <button type="button" id="btn-limpiar">Limpiar filtros</button>
        </fieldset>
      </form>
    </section>

    <div class="contenido">
      <!-- CATÁLOGO -->
      <section aria-labelledby="titulo-catalogo">
        <h2 id="titulo-catalogo">Catálogo</h2>
        <!-- Aquí se muestra: cargando, error o catálogo vacío -->
        <p id="estado-catalogo" class="mensaje" role="status"></p>
        <button type="button" id="btn-reintentar" hidden>Reintentar carga del catálogo</button>
        <product-list id="lista-productos"></product-list>
      </section>

      <!-- CARRITO Y RESUMEN DEL PEDIDO -->
      <section aria-labelledby="titulo-carrito" class="panel-carrito">
        <h2 id="titulo-carrito">Carrito y resumen del pedido</h2>
        <shopping-cart id="carrito"></shopping-cart>
        <button type="button" id="btn-confirmar" class="principal" disabled>Confirmar pedido (simulación)</button>
      </section>
    </div>
  </main>

  <!-- MODAL DE CONFIRMACIÓN DEL PEDIDO -->
  <dialog id="modal-pedido" aria-labelledby="modal-titulo">
    <h2 id="modal-titulo">Pedido confirmado</h2>
    <div id="detalle-pedido"></div>
    <p class="aviso">Esto es una simulación local: no se hizo ningún pago real ni se actualizó el inventario.</p>
    <button type="button" id="btn-cerrar-modal" class="principal">Cerrar</button>
  </dialog>

</body>
</html>
