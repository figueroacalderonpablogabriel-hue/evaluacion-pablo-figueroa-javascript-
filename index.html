<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TecnoStock</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header>
      <h1>TecnoStock</h1>
      <div id="cart-count">Carrito: 0</div>
    </header>

    <main>
      <section class="catalog">
        <h2>Catálogo</h2>

        <div class="filter-box">
          <div class="field">
            <label for="search">Buscar</label>
            <input id="search" type="text" placeholder="Nombre o descripción" />
          </div>

          <div class="field">
            <label for="category">Categoría</label>
            <select id="category">
              <option value="all">Todas</option>
            </select>
          </div>

          <div class="field">
            <label for="sort">Orden</label>
            <select id="sort">
              <option value="featured">Destacados</option>
              <option value="price-asc">Precio ↑</option>
              <option value="price-desc">Precio ↓</option>
            </select>
          </div>

          <div class="field">
            <label>&nbsp;</label>
            <button id="clearFilters" type="button">Limpiar</button>
          </div>
        </div>

        <div id="status">Cargando catálogo...</div>
        <product-list id="product-list"></product-list>
      </section>

      <section class="cart">
        <h2>Carrito</h2>
        <shopping-cart id="shopping-cart"></shopping-cart>
      </section>

      <section class="summary">
        <h2>Resumen del pedido</h2>
        <div class="row"><span>Subtotal</span><span id="subtotal">$0</span></div>
        <div class="row"><span>Descuento</span><span id="discount">$0</span></div>
        <div class="row total"><span>Total</span><span id="total">$0</span></div>
        <button id="confirmOrder" type="button" style="margin-top:10px; width:100%;">Confirmar pedido</button>
      </section>
    </main>

    <div id="toast" class="toast"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
